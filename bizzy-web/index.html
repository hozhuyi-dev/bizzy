<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: on Android the keyboard shrinks the page, so what is
         fixed to the bottom sits on it; iOS ignores it (see useKeyboardInset). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Bizzy</title>
    <script>
      // Sets the theme before the first paint, so a dark page never flashes
      // light. Mirrors src/features/theme/theme.service.ts (same storage key).
      (function () {
        var preference;
        try {
          preference = localStorage.getItem("bizzy.theme");
        } catch (e) {}
        var dark =
          preference === "dark" ||
          (preference !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Deploy

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:
    inputs:
      # Development deploys from a laptop (`pnpm dev:deploy`). Each GitHub
      # environment only deploys from its own branch, so production runs
      # only on `production`.
      env_name:
        description: "Environment to deploy to"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

# Never cancel a deploy halfway: an interrupted CloudFormation update has to
# roll back before the next one can start. Grouped by environment, so a push
# and a manual run of the same one queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.env_name || (github.ref_name == 'production' && 'production') || 'staging' }}
  cancel-in-progress: false

# Every value is a GitHub environment variable but GOOGLE_CLIENT_SECRET, the
# only secret: the client id ships in the web bundle anyway, and an account
# id or role ARN grants nothing on its own.

permissions:
  contents: read
  id-token: write

jobs:
  # Infra first: the web build reads its configuration from the stack outputs,
  # so it must not run against outputs from the previous deploy.
  infra:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env_name || (github.ref_name == 'production' && 'production') || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: bizzy-lambda/go.mod
          cache-dependency-path: bizzy-lambda/go.sum

      - name: Install dependencies
        run: pnpm -F bizzy-infra install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # This checkout's migrations on a copy of the table, before anything is
      # deployed: a migration that would fail stops the deploy here, while
      # the app still runs.
      - name: Dry-run migrations
        run: node scripts/migrate.mjs --dry-run
        env:
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Deploy stacks
        run: pnpm -F bizzy-infra cdk:deploy:ci
        env:
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CALLBACK_URLS: ${{ vars.CALLBACK_URLS }}
          LOGOUT_URLS: ${{ vars.LOGOUT_URLS }}
          ALLOWED_EMAIL: ${{ vars.ALLOWED_EMAIL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SYNC_TIME_ZONE: ${{ vars.SYNC_TIME_ZONE }}

      # The updated functions refuse the table until it is at their schema.
      - name: Migrate
        run: node scripts/migrate.mjs
        env:
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      # Every deploy uploads new Lambda builds to the CDK assets bucket, which
      # keeps the old ones until collected: delete those no stack in the
      # account uses. Ones under a day old stay, for a deploy of another
      # environment still on its way. Cleanup only, so it never fails a deploy.
      - name: Delete unused Lambda builds
        continue-on-error: true
        run: pnpm -F bizzy-infra exec cdk gc "aws://${AWS_ACCOUNT_ID}/${AWS_REGION}" --unstable=gc --type=s3 --confirm=false
        env:
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}

  web:
    needs: infra
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.env_name || (github.ref_name == 'production' && 'production') || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm -F bizzy-web install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Same script as local development, so CI can't drift from it.
      - name: Write web env from stack outputs
        run: node scripts/web-env.mjs
        env:
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          AWS_REGION: ${{ vars.AWS_REGION }}

      - name: Build
        run: pnpm -F bizzy-web build:${{ vars.ENVIRONMENT }}

      - name: Upload to S3
        run: |
          set -euo pipefail

          WEB_STACK="${{ vars.PROJECT_NAME }}-${{ vars.ENVIRONMENT }}-web"
          output() {
            aws cloudformation describe-stacks --stack-name "$WEB_STACK" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text
          }
          SITE_BUCKET=$(output SiteBucketName)
          DISTRIBUTION_ID=$(output DistributionId)
          echo "DISTRIBUTION_ID=$DISTRIBUTION_ID" >> "$GITHUB_ENV"

          DIST=bizzy-web/dist
          # Vite content-hashes everything under assets/, so cache it forever.
          aws s3 sync "$DIST" "s3://$SITE_BUCKET" \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*" --include "assets/*"
          # Un-hashed public files revalidate on every request.
          aws s3 sync "$DIST" "s3://$SITE_BUCKET" \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "assets/*" --exclude "index.html"
          # Entry document last, once everything it references is in place.
          aws s3 cp "$DIST/index.html" "s3://$SITE_BUCKET/index.html" \
            --cache-control "no-cache"
          # Then drop the previous builds' files, which nothing references
          # any more (each build names its assets anew, so they pile up).
          aws s3 sync "$DIST" "s3://$SITE_BUCKET" --delete --size-only

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" > /dev/null
